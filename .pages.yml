media:
  input: public/images
  output: /images
  rename: safe
  categories: [image, document]

content:
  - name: projects
    label: Projects
    path: src/content/projects
    type: collection
    view:
      fields: [title, year, featured, order]
      primary: title
    fields:
      - name: title
        label: Title
        type: string
      - name: year
        label: Year
        type: string
      - name: role
        label: Role
        type: string
      - name: summary
        label: Summary
        type: text
      - name: cover
        label: Cover image
        type: image
      - name: coverAlt
        label: Cover image description
        type: string
      - name: featured
        label: Feature on the home page
        type: boolean
      - name: order
        label: Sort order
        type: number
      - name: credits
        label: Credits
        type: object
        list: true
        fields:
          - name: credit
            label: Credit
            type: string
      - name: gallery
        label: Gallery
        type: object
        list: true
        fields:
          - name: src
            label: Image
            type: image
          - name: alt
            label: Image description
            type: string
          - name: caption
            label: Caption
            type: string
      - name: body
        label: Body
        type: rich-text

  - name: exhibitions
    label: Exhibitions
    path: src/content/exhibitions
    type: collection
    view:
      fields: [title, year, status, featured, order]
      primary: title
    fields:
      - name: title
        label: Title
        type: string
      - name: subtitle
        label: Subtitle
        type: string
      - name: year
        label: Year
        type: string
      - name: dates
        label: Dates
        type: string
      - name: venue
        label: Venue
        type: string
      - name: status
        label: Status
        type: select
        options:
          values: [Current, Upcoming, Past]
      - name: summary
        label: Summary
        type: text
      - name: cover
        label: Cover image
        type: image
      - name: coverAlt
        label: Cover image description
        type: string
      - name: featured
        label: Feature on the home page
        type: boolean
      - name: order
        label: Sort order
        type: number
      - name: access
        label: Access
        type: string
      - name: admission
        label: Admission
        type: string
      - name: curator
        label: Curator
        type: string
      - name: programme
        label: Programme
        type: object
        list: true
        fields:
          - name: date
            label: Date
            type: string
          - name: label
            label: Event
            type: string
          - name: description
            label: Description
            type: string
      - name: artists
        label: Artists and makers
        type: object
        list: true
        fields:
          - name: name
            label: Name
            type: string
          - name: role
            label: Role
            type: string
      - name: supporters
        label: Supporters
        type: object
        list: true
        fields:
          - name: credit
            label: Supporter
            type: string
      - name: gallery
        label: Gallery
        type: object
        list: true
        fields:
          - name: src
            label: Image
            type: image
          - name: alt
            label: Image description
            type: string
          - name: caption
            label: Caption
            type: string
      - name: body
        label: Body
        type: rich-text

  - name: writing
    label: Writing
    path: src/content/writing
    type: collection
    view:
      fields: [title, date]
      primary: title
    fields:
      - name: title
        label: Title
        type: string
      - name: date
        label: Date
        type: date
      - name: excerpt
        label: Excerpt
        type: text
      - name: link
        label: Substack link
        type: string
      - name: body
        label: Notes
        type: rich-text

  - name: home-page
    label: Home page
    path: src/data/pages/home.json
    type: file
    fields:
      - name: eyebrow
        label: Small heading
        type: string
      - name: heroTitleLine1
        label: Hero title, first line
        type: string
      - name: heroTitleLine2Prefix
        label: Hero title, second line before accent
        type: string
      - name: heroTitleAccent
        label: Hero title, italic accent
        type: string
      - name: heroLede
        label: Hero introduction
        type: text
      - name: heroImage
        label: Hero image
        type: image
      - name: heroImageAlt
        label: Hero image description
        type: text
      - name: heroCaptionLeft
        label: Hero caption, left
        type: string
      - name: heroCaptionRight
        label: Hero caption, right
        type: string
      - name: practiceEyebrow
        label: Practice section, small heading
        type: string
      - name: practiceHeading
        label: Practice section, heading
        type: text
      - name: practiceBody
        label: Practice text (blank line = new paragraph)
        type: text
      - name: practiceLinkLabel
        label: Biography link label
        type: string
      - name: projectsEyebrow
        label: Projects section, small heading
        type: string
      - name: projectsHeading
        label: Projects section, heading
        type: string
      - name: projectsLinkLabel
        label: Projects link label
        type: string
      - name: writingEyebrow
        label: Writing section, small heading
        type: string
      - name: writingHeading
        label: Writing section, heading
        type: string
      - name: writingLinkLabel
        label: Writing link label
        type: string
      - name: exhibitionEyebrow
        label: Exhibition section, small heading
        type: string
      - name: exhibitionButtonLabel
        label: Exhibition button label
        type: string

  - name: about-page
    label: About page
    path: src/data/pages/about.json
    type: file
    fields:
      - name: eyebrow
        label: Small heading
        type: string
      - name: title
        label: Page title
        type: string
      - name: lede
        label: Introduction
        type: text
      - name: portrait
        label: Portrait image
        type: image
      - name: portraitAlt
        label: Portrait image description
        type: text
      - name: portraitCaption
        label: Portrait caption
        type: string
      - name: bio
        label: Biography (blank line = new paragraph)
        type: text
      - name: cvLabel
        label: CV button label
        type: string
      - name: workEyebrow
        label: Selected work, small heading
        type: string
      - name: workHeading
        label: Selected work, heading
        type: string
      - name: workNote
        label: Selected work, note
        type: string

  - name: contact-page
    label: Contact page
    path: src/data/pages/contact.json
    type: file
    fields:
      - name: eyebrow
        label: Small heading
        type: string
      - name: title
        label: Page title
        type: string
      - name: lede
        label: Introduction
        type: text
      - name: blocks
        label: Enquiry sections
        type: object
        list: true
        fields:
          - name: title
            label: Section title
            type: string
          - name: text
            label: Section text
            type: text
          - name: linkLabel
            label: Link label
            type: string
          - name: subject
            label: Email subject
            type: string
      - name: elsewhereEyebrow
        label: Social section, small heading
        type: string
      - name: elsewhereHeading
        label: Social section, heading
        type: string
      - name: elsewhereLede
        label: Social section, introduction
        type: text

  - name: writing-page
    label: Writing page
    path: src/data/pages/writing.json
    type: file
    fields:
      - name: eyebrow
        label: Small heading
        type: string
      - name: title
        label: Page title
        type: string
      - name: lede
        label: Introduction
        type: text
      - name: subscribeEyebrow
        label: Subscribe section, small heading
        type: string
      - name: subscribeHeading
        label: Subscribe section, heading
        type: string
      - name: subscribeLede
        label: Subscribe section, introduction
        type: text
      - name: subscribeLabel
        label: Subscribe button label
        type: string

  - name: site-settings
    label: Site settings
    path: src/data/settings.json
    type: file
    fields:
      - name: name
        label: Name
        type: string
      - name: role
        label: Role
        type: string
      - name: description
        label: Site description (used in search results)
        type: text
      - name: email
        label: Contact email
        type: string
      - name: substack
        label: Substack URL
        type: string
      - name: instagram
        label: Instagram URL
        type: string
      - name: footerCredit
        label: Footer credit
        type: string
      - name: footerHeading
        label: Footer contact heading
        type: text
      - name: footerRole
        label: Footer role line
        type: string
      - name: subscribeLabel
        label: Subscribe button label
        type: string
      - name: navProjects
        label: Navigation label — Projects
        type: string
      - name: navExhibitions
        label: Navigation label — Exhibitions
        type: string
      - name: navWriting
        label: Navigation label — Writing
        type: string
      - name: navAbout
        label: Navigation label — About
        type: string
      - name: navContact
        label: Navigation label — Contact
        type: string
      - name: cvUrl
        label: CV file (leave empty for email requests)
        type: file

  - name: projects-page
    label: Projects page
    path: src/data/pages/projects.json
    type: file
    fields:
      - name: eyebrow
        label: Small heading
        type: string
      - name: title
        label: Page title
        type: string
      - name: lede
        label: Introduction
        type: text

  - name: exhibitions-page
    label: Exhibitions page
    path: src/data/pages/exhibitions.json
    type: file
    fields:
      - name: eyebrow
        label: Small heading
        type: string
      - name: title
        label: Page title
        type: string
      - name: lede
        label: Introduction
        type: text
      - name: viewLabel
        label: View exhibition link label
        type: string


