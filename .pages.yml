media:
  input: public/images
  output: /images

content:
  - name: projects
    label: Projects
    path: src/content/projects
    type: collection
    view:
      fields: [title, year, featured, order]
      primary: title
    fields:
      - name: title
        label: Title
        type: string
      - name: year
        label: Year
        type: string
      - name: role
        label: Role
        type: string
      - name: summary
        label: Summary
        type: text
      - name: cover
        label: Cover image
        type: image
      - name: coverAlt
        label: Cover image description
        type: string
      - name: featured
        label: Feature on the home page
        type: boolean
      - name: order
        label: Sort order
        type: number
      - name: credits
        label: Credits
        type: list
        fields:
          - name: credit
            label: Credit
            type: string
      - name: body
        label: Body
        type: rich-text

  - name: writing
    label: Writing
    path: src/content/writing
    type: collection
    view:
      fields: [title, date]
      primary: title
    fields:
      - name: title
        label: Title
        type: string
      - name: date
        label: Date
        type: date
      - name: excerpt
        label: Excerpt
        type: text
      - name: link
        label: Substack link
        type: string
      - name: body
        label: Notes
        type: rich-text
