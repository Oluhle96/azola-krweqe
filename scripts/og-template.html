<!doctype html>
<!-- Source for public/og.png. Render at 1200x630 with:
     chrome --headless --screenshot=og.png --window-size=1200,630 scripts/og-template.html -->
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #f4f0e6; color: #15120f;
    font-family: Arial, Helvetica, sans-serif;
    position: relative;
  }
  .grid {
    position: absolute; inset: 0;
    padding: 56px 64px;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .top { display: flex; justify-content: space-between; align-items: flex-start; }
  .label {
    font-family: "Courier New", monospace;
    font-size: 15px; letter-spacing: 0.14em; text-transform: uppercase;
    color: #a32b20;
  }
  .label::before {
    content: ''; display: inline-block; width: 28px; height: 1px;
    background: #a32b20; vertical-align: middle; margin-right: 12px;
  }
  .top .label { color: #6e665c; }
  .top .label::before { background: #6e665c; }
  h1 {
    font-size: 132px; line-height: 0.92; letter-spacing: -0.045em;
    font-weight: 700; max-width: 760px;
  }
  h1 em {
    font-family: Georgia, "Times New Roman", serif;
    font-style: italic; font-weight: 400; color: #a32b20;
    letter-spacing: -0.02em;
  }
  .bottom {
    display: flex; justify-content: space-between; align-items: flex-end;
    border-top: 1px solid rgba(21,18,15,0.25); padding-top: 20px;
  }
  .sub {
    font-family: "Courier New", monospace;
    font-size: 14px; letter-spacing: 0.1em; text-transform: uppercase;
    color: #6e665c; line-height: 1.8;
  }
  .url {
    font-family: "Courier New", monospace;
    font-size: 14px; letter-spacing: 0.1em; text-transform: uppercase;
    color: #15120f;
  }
  .disc {
    position: absolute; right: -90px; top: 120px;
    width: 420px; height: 420px; border-radius: 50%;
    background: #a32b20;
  }
  .ring {
    position: absolute; right: -30px; top: 180px;
    width: 300px; height: 300px; border-radius: 50%;
    border: 1.5px solid #f4f0e6;
  }
</style>
</head>
<body>
  <div class="disc"></div>
  <div class="ring"></div>
  <div class="grid">
    <div class="top">
      <span class="label">Artist &amp; curator</span>
      <span class="label">Portfolio — 2026</span>
    </div>
    <h1>Azola<br>Krweqe<br><em>archive.</em></h1>
    <div class="bottom">
      <span class="sub">Exhibition-making<br>Moving image<br>Writing</span>
      <span class="url">azolakrweqe.co.za</span>
    </div>
  </div>
</body>
</html>
